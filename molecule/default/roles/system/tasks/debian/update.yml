---
- name: Verify APT cache status
  block:
    - name: Check APT cache timestamp
      ansible.builtin.stat:
        path: /var/lib/apt/lists
      register: system_apt_cache_stat

    - name: Assert APT cache is recent
      ansible.builtin.assert:
        that:
          - system_apt_cache_stat.stat.exists
          - (ansible_date_time.epoch | int) - (system_apt_cache_stat.stat.mtime) < 3900
        fail_msg: "APT cache appears to be outdated or not updated"
        success_msg: "APT cache is up to date"

- name: Verify system update status
  block:
    - name: Check for available updates
      ansible.builtin.command: apt list --upgradable
      register: system_apt_upgradable
      changed_when: false

    - name: Assert minimal pending updates
      ansible.builtin.assert:
        that: system_apt_upgradable.stdout_lines | length <= 5
        fail_msg: "Too many pending updates found: {{ system_apt_upgradable.stdout_lines | length }}"
        success_msg: >-
          System appears to be up to date ({{ system_apt_upgradable.stdout_lines | length - 1 }} pending updates)
