---
- name: Include distribution-specific setup
  ansible.builtin.include_tasks: "{{ system_os_family }}/setup.yml"

- name: Install Docker packages
  ansible.builtin.package:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
      - python3-jsondiff
      - python3-yaml
    state: present
  retries: 3
  delay: 10
  become: true
  notify: "system : request reboot"

- name: Create Docker systemd override directory
  ansible.builtin.file:
    path: "{{ docker_systemd_override_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Deploy Docker systemd override configuration
  ansible.builtin.copy:
    src: override.conf
    dest: "{{ docker_systemd_override_dir }}/override.conf"
    mode: "0644"
  become: true
  notify: "docker : restart"

- name: Deploy Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  become: true
  notify: "docker : restart"

- name: Add Docker user to the Docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  become: true
  notify: "system : reset connection"

- name: Enable Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    daemon-reload: true
    state: started
  become: true
  when: system_systemd_managed
